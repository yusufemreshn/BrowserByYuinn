<!-- Bu dosya, tarayıcının toolbar arayüzünün iskeletini oluşturur, yani sekme şeridinin ve geri, ileri, yenile, ana sayfa, yıldız butonlarının ve adres çubuğunun nerede duracağını belirler. -->
<!-- Bu dosya, native C++ tarafındaki BrowserWindow sınıfı tarafından bir WebView2 içine yüklenir, görünümü chrome.css dosyasından, davranışı chrome.js dosyasından gelir. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" /> <!-- Sayfanın Türkçe karakterleri doğru göstermesi için karakter kodlaması belirtilir -->
    <title>Toolbar</title> <!-- Bu sayfanın başlığı, kullanıcıya hiç görünmez çünkü bu sayfa pencerenin başlığı olarak kullanılmaz -->
    <link rel="stylesheet" href="chrome.css" /> <!-- Görsel görünümü tanımlayan stil dosyası bağlanır -->
</head>
<body>
    <div id="sekme-seridi"> <!-- Açık olan tüm sekmelerin listelendiği şerit, içeriği chrome.js tarafından sürekli güncellenir -->
        <div id="sekmeler-kapsayici"> <!-- Her sekme için bir sekme öğesinin eklendiği kapsayıcı, şeritte kalan tüm alanı kaplar, bu sayede hem sekme genişlikleri güvenilir şekilde hesaplanabilir hem de yeni sekme butonu her zaman son sekmenin hemen bitişiğinde kalır -->
            <div id="aktif-sekme-gostergesi"></div> <!-- Aktif sekmenin altında kayarak hareket eden ince vurgu çizgisi, konumu chrome.js tarafından hesaplanır -->
            <button id="buton-yeni-sekme" title="Yeni sekme (Ctrl+T)">+</button> <!-- Yeni bir sekme açmayı sağlayan buton, kapsayıcının içinde, sekmelerin hemen ardında yer alır, böylece kalan boş alan bu butondan SONRA kalır -->
        </div>
        <input id="sekme-arama-girdi" class="gizli" type="text" placeholder="Sekmelerde ara" /> <!-- Ctrl+Shift+A ile açılan, sekmeleri başlığa göre filtreleyen arama kutusu, butonu kaldırıldı çünkü kısayolla hâlâ açılabiliyor -->
        <div id="pencere-kontrolleri"> <!-- Windows'un kendi başlık çubuğu kaldırıldığı için, küçült/büyüt/kapat butonları burada kendimiz çiziyoruz -->
            <button id="buton-kucult" class="pencere-kontrol" title="Küçült">&#x2015;</button> <!-- Pencereyi görev çubuğuna küçültür -->
            <button id="buton-buyut" class="pencere-kontrol" title="Büyüt">&#x25A1;</button> <!-- Pencereyi büyütür veya eski boyutuna döndürür, simgesi chrome.js tarafından duruma göre değiştirilir -->
            <button id="buton-kapat" class="pencere-kontrol pencere-kontrol-kapat" title="Kapat">&#x2715;</button> <!-- Programı tamamen kapatır -->
        </div>
    </div>

    <div id="toolbar"> <!-- Geri, ileri, yenile, ana sayfa butonlarını ve adres çubuğunu saran ana kutu -->
        <button id="buton-geri" title="Geri">&#x2190;</button> <!-- Bir önceki sayfaya gitmeyi sağlayan buton -->
        <button id="buton-ileri" title="İleri">&#x2192;</button> <!-- Bir sonraki sayfaya gitmeyi sağlayan buton -->
        <button id="buton-yenile" title="Yenile">&#x21bb;</button> <!-- Güncel sayfayı yeniden yüklemeyi sağlayan buton -->
        <button id="buton-anasayfa" title="Ana Sayfa">&#x2302;</button> <!-- Sabit ana sayfaya gitmeyi sağlayan buton -->
        <div id="adres-cubugu-kabi"> <!-- Adres çubuğunu ve kilit simgesini saran, hap biçimli kap -->
            <button id="adres-cubugu-kilit" title="Site bilgileri">&#x1F512;</button> <!-- Bağlantının güvenlik durumunu gösteren ve tıklanınca site bilgisi/izinleri panelini açan buton, simgesi chrome.js tarafından güvenlik durumuna göre değiştirilir -->
            <input id="adres-cubugu" type="text" placeholder="Bir adres yazın veya arama yapın" autocomplete="off" spellcheck="false" /> <!-- Kullanıcının adres veya arama metni yazdığı kutu -->
            <span id="adres-cubugu-hesap-sonucu" class="gizli"></span> <!-- Yazılan metin basit bir matematik işlemiyse, sonucu burada anında gösterilir -->
        </div>
        <button id="buton-yildiz" title="Yer imlerine ekle">&#x2606;</button> <!-- Güncel sayfayı yer imlerine ekleyip çıkarmayı sağlayan buton -->
        <button id="buton-hamburger" title="Menü">&#x2630;</button> <!-- Üst üste 3 yatay çizgiden oluşan menü butonu; menünün KENDİSİ artık ayrı bir native pencerede (menu.html), native taraf tarafından konumlanıp gösterilir, bu yüzden burada sadece buton var -->
    </div>
    <div id="yerimi-cubugu"></div> <!-- En üst seviye yer imlerini (ve tek seviyeli klasörleri) gösteren ince çubuk, içeriği chrome.js tarafından native taraftan gelen listeyle doldurulur, Ayarlar'dan kapatılabilir -->
    <script src="chrome.js"></script> <!-- Sekme şeridinin, butonların ve native tarafla mesajlaşma mantığının bulunduğu JavaScript dosyası eklenir -->
</body>
</html>
