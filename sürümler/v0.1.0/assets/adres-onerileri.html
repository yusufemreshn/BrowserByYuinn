<!-- Bu dosya, adres çubuğuna yazarken beliren, geçmiş ve yer imlerinden eşleşen adresleri listeleyen öneri panelinin iskeletini oluşturur. -->
<!-- Bu panel, diğer küçük bildirim panelleriyle aynı mimariyi kullanır: BrowserWindow sınıfı tarafından oluşturulan AYRI bir WebView2 denetleyicisinde gösterilir, adres çubuğunun hemen altında konumlanır. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>Adres Önerileri</title>
    <link rel="stylesheet" href="chrome.css" /> <!-- .oneri-sayfasi gibi bu panele özel stiller de chrome.css içinde tanımlıdır -->
</head>
<body class="oneri-sayfasi">
    <div id="oneri-listesi"></div> <!-- Eşleşen adreslerin listeleneceği kapsayıcı, native taraftan gelen listeyle doldurulur -->
    <script src="adres-onerileri.js"></script>
</body>
</html>
