<!-- Bu dosya, programın kullanıcı tarafından ilk kez açıldığında gösterilen, sade bir karşılama ekranının iskeletini oluşturur. -->
<!-- Bu sayfa, kullanıcı seçimlerini tamamladığında veya "Atla" dediğinde bir daha asla gösterilmez, native taraf bunu settings.json içindeki ilkAcilisTamamlandiMi alanıyla hatırlar. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" /> <!-- Sayfanın Türkçe karakterleri doğru göstermesi için karakter kodlaması belirtilir -->
    <title>Hoş Geldiniz</title>
    <link rel="stylesheet" href="onboarding.css" /> <!-- Görsel görünümü tanımlayan stil dosyası bağlanır -->
</head>
<body>
    <div id="karsilama-karti"> <!-- Ekranın ortasında duran, tüm karşılama içeriğini saran kart -->
        <h1>Tarayıcınızı kişiselleştirin</h1>
        <p class="aciklama">Birkaç saniyede hazır, istediğiniz zaman Ayarlar'dan değiştirebilirsiniz.</p>

        <div class="soru">
            <div class="soru-baslik">Vurgu renginiz</div>
            <div id="renk-secenekleri"></div> <!-- Renk noktaları, onboarding.js tarafından burada oluşturulur -->
        </div>

        <div class="soru">
            <div class="soru-baslik">Varsayılan arama motoru</div>
            <div class="segment-grup" id="motor-secenekleri">
                <button class="segment secili" data-motor="google">Google</button>
                <button class="segment" data-motor="bing">Bing</button>
                <button class="segment" data-motor="duckduckgo">DuckDuckGo</button>
            </div>
        </div>

        <div class="soru">
            <div class="soru-baslik">Varsayılan tarayıcı</div>
            <p class="aciklama" style="margin:0 0 8px 0;">Web bağlantılarının bu tarayıcıyla açılmasını istiyorsanız, Windows'un ayar sayfasından seçebilirsiniz</p>
            <button id="buton-varsayilan-tarayici" class="ikincil-buton">Windows Ayarlarını Aç</button>
        </div>

        <div class="eylemler">
            <button id="buton-atla" class="ikincil-buton">Atla</button>
            <button id="buton-basla" class="birincil-buton">Başla</button>
        </div>
    </div>
    <script src="onboarding.js"></script> <!-- Karşılama ekranının davranışını yöneten JavaScript dosyası eklenir -->
</body>
</html>
