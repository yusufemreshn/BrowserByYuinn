<!-- Bu dosya, bir sitenin HTTPS sertifikası güvenilmez/hatalı bulunduğunda beliren, ayrı küçük bir native pencerede gösterilen sertifika hatası panelinin iskeletini oluşturur. -->
<!-- Bu panel, menü, DevTools ve izin bildirim panelleriyle aynı mimariyi kullanır: BrowserWindow sınıfı tarafından oluşturulan AYRI bir WebView2 denetleyicisinde gösterilir, böylece ne içerik kayar ne de örtülür. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>Sertifika Hatası</title> <!-- Bu sayfanın başlığı, kullanıcıya hiç görünmez -->
    <link rel="stylesheet" href="chrome.css" /> <!-- .sertifika-sayfasi gibi bu panele özel stiller de chrome.css içinde tanımlıdır -->
</head>
<body class="sertifika-sayfasi">
    <div id="sertifika-baslik">&#x26A0; Bağlantı güvenli değil</div>
    <p id="sertifika-aciklama"></p> <!-- Hatanın türünü anlatan sade açıklama, native taraftan gelir -->
    <div id="sertifika-adres"></div> <!-- Hatanın oluştuğu adres -->
    <div id="sertifika-detaylar"></div> <!-- Sertifikanın konu/yayınlayan/geçerlilik tarihleri gibi temel bilgileri -->
    <div id="sertifika-butonlari">
        <button id="sertifika-geri-don-butonu">Geri Dön (Önerilen)</button>
        <button id="sertifika-yine-de-git-butonu">Yine de Git</button>
    </div>
    <script src="sertifika-hatasi.js"></script>
</body>
</html>
