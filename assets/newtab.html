<!-- Bu dosya, yeni bir sekme açıldığında gösterilen hızlı erişim sayfasının iskeletini oluşturur, en çok ziyaret edilen siteleri kutular halinde gösterir. -->
<!-- Bu dosya, BrowserWindow sınıfı tarafından, her yeni sekmenin ve programın ilk açılışının varsayılan adresi olarak, dahili (tarayici.local) bir sekmede yüklenir. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" /> <!-- Sayfanın Türkçe karakterleri doğru göstermesi için karakter kodlaması belirtilir -->
    <title>Yeni Sekme</title> <!-- Bu sayfanın başlığı, sekme şeridinde görünsün diye JavaScript tarafında da document.title ile ayrıca ayarlanır -->
    <link rel="stylesheet" href="newtab.css" /> <!-- Görsel görünümü tanımlayan stil dosyası bağlanır -->
</head>
<body>
    <div id="newtab-govde"> <!-- Sayfanın tüm içeriğini ortalayan ana kapsayıcı -->
        <div id="hizli-erisim-kutulari"></div> <!-- En çok ziyaret edilen siteler, settings.js'dekine benzer bir mantıkla burada listelenir -->
        <p id="bos-durum-mesaji" class="gizli">Henüz bir gezinme geçmişiniz yok, bir sayfa ziyaret ettiğinizde burada hızlı erişim kutuları belirecek.</p>
    </div>
    <script src="newtab.js"></script> <!-- Hızlı erişim kutularını dolduran JavaScript dosyası eklenir -->
</body>
</html>
