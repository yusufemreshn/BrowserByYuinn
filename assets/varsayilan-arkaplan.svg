<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="zemin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#121a2e"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="isik1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a6bd8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a6bd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="isik2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b3ab0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7b3ab0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="isik3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1fb0a0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1fb0a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="yumusat" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#zemin)"/>

  <g filter="url(#yumusat)">
    <circle cx="420" cy="260" r="420" fill="url(#isik1)"/>
    <circle cx="1560" cy="300" r="480" fill="url(#isik2)"/>
    <circle cx="1100" cy="860" r="520" fill="url(#isik3)"/>
    <circle cx="260" cy="900" r="300" fill="url(#isik2)"/>
  </g>
</svg>
