<!-- Bu dosya, adres çubuğundaki kilit ikonuna tıklanınca beliren, ayrı küçük bir native pencerede gösterilen site bilgisi/izinleri panelinin iskeletini oluşturur. -->
<!-- Bu panel, menü, DevTools ve izin bildirim panelleriyle aynı mimariyi kullanır: BrowserWindow sınıfı tarafından oluşturulan AYRI bir WebView2 denetleyicisinde gösterilir, böylece ne içerik kayar ne de örtülür. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>Site Bilgisi</title> <!-- Bu sayfanın başlığı, kullanıcıya hiç görünmez -->
    <link rel="stylesheet" href="chrome.css" /> <!-- .site-paneli-sayfasi gibi bu panele özel stiller de chrome.css içinde tanımlıdır -->
</head>
<body class="site-paneli-sayfasi">
    <div id="site-paneli-adres"></div> <!-- Panelin ait olduğu sitenin alan adı, native taraftan gelen bilgiyle doldurulur -->
    <div id="site-paneli-durum"></div> <!-- "Bağlantı güvenli" veya "Bağlantı güvenli değil" gibi, güvenlik durumunu anlatan metin -->
    <div id="site-paneli-sertifika" class="gizli"></div> <!-- Geçerli bir HTTPS bağlantısında, sertifikanın konu/yayınlayan/protokol bilgisi, native taraftan gelince burada gösterilir -->
    <div id="site-paneli-izinler-basligi">Bu site için izinler</div>
    <div id="site-paneli-izin-yok" class="gizli">Bu site için kayıtlı bir izin kararı yok.</div>
    <div id="site-paneli-izinler-listesi"></div> <!-- Bu siteye verilmiş/engellenmiş izinlerin listesi, her biri "Kaldır" butonuyla, buraya dinamik olarak eklenir -->
    <script src="site-paneli.js"></script>
</body>
</html>
