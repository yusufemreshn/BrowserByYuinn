<!-- Bu dosya, hamburger menü panelinin iskeletini oluşturur. -->
<!-- Daha önce bu panel toolbar'ın (chrome.html) içinde, üstüne bindirilmiş bir <div> olarak gösteriliyordu; bu, menü açıldığında ya içeriği aşağı kaydırıyordu ya da (toolbar'ın kendi WebView2'si büyütülüp öne alındığında) altındaki sayfayı tamamen örtüyordu. -->
<!-- Artık bu panel, native C++ tarafındaki BrowserWindow sınıfı tarafından oluşturulan, SADECE panelin kendi boyutu kadar olan AYRI bir WebView2 denetleyicisinde gösteriliyor, bu yüzden ne içerik kayıyor ne de örtülüyor. -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>Menü</title> <!-- Bu sayfanın başlığı, kullanıcıya hiç görünmez -->
    <link rel="stylesheet" href="chrome.css" /> <!-- .menu-ogesi, .menu-ayrac gibi ortak menü stilleri buradan alınır -->
</head>
<body class="menu-sayfasi">
    <div id="menu-ram-gostergesi">RAM: <span id="menu-ram-deger">—</span></div> <!-- Güncel toplam RAM kullanımını gösteren üst satır -->
    <button class="menu-ogesi" data-komut="newtab">Yeni Sekme<span class="menu-kisayol">Ctrl+T</span></button>
    <button class="menu-ogesi" data-komut="newprivatetab">Yeni Gizli Sekme<span class="menu-kisayol">Ctrl+Shift+N</span></button>
    <button class="menu-ogesi" data-komut="duplicateactivetab">Sekmeyi Çoğalt<span class="menu-kisayol">Ctrl+D</span></button>
    <button class="menu-ogesi" data-komut="addtoreadinglist">Sayfayı Okuma Listesine Ekle</button>
    <button class="menu-ogesi" data-komut="reopenclosedtab">Son Kapatılan Sekmeyi Aç<span class="menu-kisayol">Ctrl+Shift+T</span></button>
    <div class="menu-ayrac"></div>
    <button class="menu-ogesi" data-komut="opensettings|gecmis">Geçmiş</button>
    <button class="menu-ogesi" data-komut="opensettings|yerimleri">Yer İmleri</button>
    <button class="menu-ogesi" data-komut="opensettings|okumalistesi">Okuma Listesi</button>
    <button class="menu-ogesi" data-komut="opensettings|sifreler">Şifreler</button>
    <button class="menu-ogesi" data-komut="opensettings|hatagunlugu">Hata Günlüğü</button>
    <div class="menu-ayrac"></div>
    <div id="menu-yakinlastir-satiri"> <!-- Yakınlaştırma oranını azaltıp artırmayı sağlayan satır -->
        <span>Yakınlaştır</span>
        <div id="menu-yakinlastir-kontrolleri">
            <button id="menu-yakinlastir-azalt" title="Uzaklaştır (Ctrl+-)">&#x2212;</button>
            <span id="menu-yakinlastir-yuzde">100%</span>
            <button id="menu-yakinlastir-arttir" title="Yakınlaştır (Ctrl+=)">&#x2b;</button>
        </div>
    </div>
    <button class="menu-ogesi" data-komut="findinpage">Sayfada Bul<span class="menu-kisayol">Ctrl+F</span></button>
    <button class="menu-ogesi" data-komut="print">Yazdır / PDF Kaydet<span class="menu-kisayol">Ctrl+P</span></button>
    <button class="menu-ogesi" data-komut="readermode">Okuyucu Modu</button>
    <button class="menu-ogesi" data-komut="translatepage">Sayfayı Çevir</button>
    <button class="menu-ogesi" data-komut="forcedarkmode">Siteyi Koyu Göster</button>
    <button class="menu-ogesi" data-komut="readeraloud">Sayfayı Sesli Oku</button>
    <button class="menu-ogesi" data-komut="openshortcuts">Klavye Kısayolları<span class="menu-kisayol">Ctrl+/</span></button>
    <div class="menu-ayrac"></div>
    <button class="menu-ogesi" data-komut="opensettings">Ayarlar</button>
    <button class="menu-ogesi" data-komut="winclose">Çıkış</button>
    <script src="menu.js"></script>
</body>
</html>
